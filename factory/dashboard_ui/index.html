<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Factory runs</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="workspace">
    <header class="page-header">
      <div><h1>Factory runs</h1><p id="project"></p></div>
      <p id="connection" class="connection" role="status">Connecting</p>
    </header>
    <div class="toolbar">
      <label id="repository-filter" hidden>Repository <select id="repository"><option value="">All repositories</option></select></label>
      <p id="count" class="count"></p>
      <ul class="legend" aria-label="Verdict key">
        <li><span class="key pass" aria-hidden="true"></span>Pass</li>
        <li><span class="key fail" aria-hidden="true"></span>Failed</li>
        <li><span class="key progress" aria-hidden="true"></span>In progress</li>
      </ul>
    </div>
    <p id="message" role="alert" class="notice" hidden></p>
    <p id="empty" class="notice">Loading runs…</p>
    <div id="board" class="board" aria-label="Run stages"></div>
  </main>
  <dialog id="run-details" class="drawer" aria-labelledby="run-title">
    <header class="drawer-heading">
      <div><p id="run-identity" class="identity"></p><h2 id="run-title" tabindex="-1">Run details</h2></div>
      <form method="dialog"><button class="close" autofocus>Close</button></form>
    </header>
    <div id="detail" class="drawer-body"></div>
  </dialog>
</body>
</html>
